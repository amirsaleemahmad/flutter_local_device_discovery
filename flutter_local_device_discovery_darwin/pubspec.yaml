name: flutter_local_device_discovery_darwin
description: >
  Apple platform implementation (iOS and macOS) of the
  flutter_local_device_discovery plugin.
version: 0.2.0
homepage: https://github.com/amirsaleemahmad/flutter_local_device_discovery
repository: https://github.com/amirsaleemahmad/flutter_local_device_discovery.git
issue_tracker: https://github.com/amirsaleemahmad/flutter_local_device_discovery/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_device_discovery_platform_interface: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FlutterLocalDeviceDiscoveryPlugin
        sharedDarwinSource: true
        swiftPackage: true
      macos:
        pluginClass: FlutterLocalDeviceDiscoveryPlugin
        sharedDarwinSource: true
        swiftPackage: true

topics:
  - device-discovery
  - mdns
  - bonjour
  - ios
  - macos
