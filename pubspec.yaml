name: flutter_local_device_discovery
description: >
  Local-network device and service discovery for Flutter using mDNS/DNS-SD,
  Bonjour, SSDP, and secure UPnP metadata on Android, iOS, macOS, and Windows.
version: 1.0.0
homepage: https://github.com/amirsaleemahmad/flutter_local_device_discovery
repository: https://github.com/amirsaleemahmad/flutter_local_device_discovery.git
issue_tracker: https://github.com/amirsaleemahmad/flutter_local_device_discovery/issues
funding:
  - https://ko-fi.com/X8Y824GXT3

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_device_discovery_platform_interface: ^1.0.0
  flutter_local_device_discovery_android: ^1.0.0
  flutter_local_device_discovery_darwin: ^1.0.0
  flutter_local_device_discovery_windows: ^1.0.0
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_local_device_discovery_android
      ios:
        default_package: flutter_local_device_discovery_darwin
      macos:
        default_package: flutter_local_device_discovery_darwin
      windows:
        default_package: flutter_local_device_discovery_windows
      web:
        default_package: flutter_local_device_discovery

topics:
  - device-discovery
  - local-network
  - mdns
  - ssdp
  - upnp
