name: flutter_local_device_discovery
description: >
  Native local-network device and service discovery for Flutter using
  mDNS, DNS-SD, Bonjour, SSDP, UPnP and WS-Discovery across Android,
  iOS, macOS and Windows. #device-discovery #mdns #bonjour #dns-sd
  #local-network #networking #upnp #ssdp #service-discovery
  #zeroconf #multicast #flutter-plugin
version: 0.2.0
homepage: https://github.com/amirsaleemahmad/flutter_local_device_discovery
repository: https://github.com/amirsaleemahmad/flutter_local_device_discovery.git
issue_tracker: https://github.com/amirsaleemahmad/flutter_local_device_discovery/issues

environment:
  sdk: ^3.12.2
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_device_discovery_platform_interface: ^0.2.0
  flutter_local_device_discovery_android: ^0.2.0
  flutter_local_device_discovery_darwin: ^0.2.0
  flutter_local_device_discovery_windows: ^0.2.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_local_device_discovery_platform_interface:
    path: flutter_local_device_discovery_platform_interface
  flutter_local_device_discovery_android:
    path: flutter_local_device_discovery_android
  flutter_local_device_discovery_darwin:
    path: flutter_local_device_discovery_darwin
  flutter_local_device_discovery_windows:
    path: flutter_local_device_discovery_windows

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_local_device_discovery_android
      ios:
        default_package: flutter_local_device_discovery_darwin
      macos:
        default_package: flutter_local_device_discovery_darwin
      windows:
        default_package: flutter_local_device_discovery_windows
      web:
        default_package: flutter_local_device_discovery

topics:
  - device-discovery
  - local-network
  - mdns
  - networking
  - service-discovery
